<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/airport.css">

    <!-- 아이콘 라이브러리 -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <header>
        <div class="qr_wrap">
            <img src="./img/qr_img.svg" alt="qr_img">
            <div class="search_wrap">
                <span>항공날씨</span>
                <span class="material-symbols-outlined">search</span>
            </div>
        </div>

        <div class="ment">
            <h2>하늘길의 안전한 날씨 지원은 항공기상청이 함께합니다</h2>
        </div>

        <div class="now">
            <span class="now_date">2026년 5월 11일</span>
            <span class="now_time">10:03:00</span>
        </div>
    </header>
    <main>
        <div class="main_wrap">
            <div class="port_wrap start-port" style="border-right: 1px solid #ddd;">
                <div class="content_header">
                    <div class="airport_card">
                        <div class="badge_wrap start">
                            <span class="material-symbols-outlined">location_on</span>
                            <span class="badge_text ">출발</span>
                        </div>
                        <div class="airport_info">
                            <span class="airport_kr">김포공항</span>
                            <span class="airport_eng">GIMPO AIRPORT</span>
                        </div>
                    </div>

                    <span>강풍경보 발표중</span>
                </div>
            </div>

            <div class="port-wrap arrive-port">
                <div class="content_header">
                    <div class="airport_card">
                        <div class="badge_wrap start">
                            <span class="material-symbols-outlined">location_on</span>
                            <span class="badge_text ">출발</span>
                        </div>
                        <div class="airport_info">
                            <span class="airport_kr">김포공항</span>
                            <span class="airport_eng">GIMPO AIRPORT</span>
                        </div>
                    </div>
                    
                    <span>강풍경보 발표중</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
